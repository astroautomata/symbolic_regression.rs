name: CI (SR)

on:
  pull_request:
    branches:
      - main
    paths:
      - symbolic_regression/**
      - symbolic_regression_py/**
      - dynamic_expressions/**
      - .cargo/**
      - Cargo.toml
      - codecov.yml
      - xtask/**
      - tools/**
      - .github/workflows/ci-symbolic-regression.yml
  push:
    branches:
      - main
    paths:
      - symbolic_regression/**
      - symbolic_regression_py/**
      - dynamic_expressions/**
      - .cargo/**
      - Cargo.toml
      - codecov.yml
      - xtask/**
      - tools/**
      - .github/workflows/ci-symbolic-regression.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-build:
    name: cargo build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build -p symbolic_regression --all-targets --all-features

  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (rustfmt)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (clippy)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy -p symbolic_regression --all-targets --all-features -- -D warnings

  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test -p symbolic_regression --all-targets --all-features

  parity:
    name: test-suite parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: SymbolicRegression.jl at the pinned commit
        run: |
          git clone --filter=blob:none https://github.com/astroautomata/SymbolicRegression.jl "$RUNNER_TEMP/SymbolicRegression.jl"
          git -C "$RUNNER_TEMP/SymbolicRegression.jl" checkout --detach f97764fb898a0279ca434a615d4e40f52fdb9469

      - name: Checker tests
        run: cargo test -p xtask

      - name: Parity check
        run: cargo xtask parity --julia-repo "$RUNNER_TEMP/SymbolicRegression.jl" --require-done-through 7 --run

  python-wheel:
    name: Python abi3 wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install wheel build and test dependencies
        run: python -m pip install "maturin>=1.9.4,<2" numpy pytest

      - name: Check Rust bindings
        run: |
          cargo clippy -p symbolic_regression_py --all-targets -- -D warnings
          cargo test -p symbolic_regression_py --lib

      - name: Build abi3 wheel
        run: maturin build --release --manifest-path symbolic_regression_py/Cargo.toml --out wheelhouse

      - name: Install wheel
        run: python -m pip install wheelhouse/*.whl

      - name: Build Rust parity example
        run: cargo build --release -p symbolic_regression_py --example python_parity

      - name: Python acceptance tests and Rust parity
        env:
          SYMBOLIC_REGRESSION_RUST_EXAMPLE: ${{ github.workspace }}/target/release/examples/python_parity
        run: python -m pytest symbolic_regression_py/tests

  coverage:
    name: coverage (codecov)
    runs-on: ubuntu-latest
    env:
      HAS_CODECOV_ACCESS: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (llvm-tools)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        if: env.HAS_CODECOV_ACCESS == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        if: env.HAS_CODECOV_ACCESS == 'true'
        run: cargo llvm-cov -p symbolic_regression --all-features --all-targets --lcov --output-path lcov.info

      - name: Run tests (no coverage token)
        if: env.HAS_CODECOV_ACCESS != 'true'
        run: cargo test -p symbolic_regression --all-targets --all-features

      - name: Upload to Codecov
        if: env.HAS_CODECOV_ACCESS == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  cargo-doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc
        run: cargo doc -p symbolic_regression --all-features --no-deps

  cargo-package:
    name: cargo package
    runs-on: ubuntu-latest
    # `cargo package` resolves dependencies against crates.io, which races with the
    # release-please publish workflow whenever a release commit lands on `main` (the new dep
    # version isn't on the index yet). Skip on `push` events: PRs already validate packaging
    # before merge, and `release-please.yml -> publish-crates.yml` runs `cargo publish`
    # (a strict superset) for actual releases.
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo package symbolic_regression
        run: cargo package -p symbolic_regression --no-verify
